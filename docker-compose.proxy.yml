# Overlay para o servidor com o proxy reverso (nginx + Cloudflare Tunnel em /mnt/hd2tb/proxy):
# o app entra na rede docker externa "proxy" e o nginx fala com ele por "termhub-app:3000".
#   docker compose --env-file <env> -f docker-compose.yml -f docker-compose.proxy.yml --profile prod up -d --build
services:
  app:
    container_name: termhub-app
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
