# Static landing. Hashed assets are cached for a year; index.html is not.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Unhashed public files (icons, social preview, robots, sitemap): cache for a day
    location ~* \.(png|svg|ico|txt|xml)$ {
        add_header Cache-Control "public, max-age=86400";
    }
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
    # Single page, no client-side routes: unknown paths are a real 404 (no soft-404 for crawlers)
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
