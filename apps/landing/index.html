              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Um painel no navegador para os terminais das suas máquinas. Você cadastra máquinas (local ou SSH), organiza por projeto e abre tabs; cada tab é uma sessão tmux na máquina de destino, que continua rodando quando você fecha o navegador."

              }
            },
            {
              "@type": "Question",
              "name": "É seguro? Onde ficam as credenciais?",
              "acceptedAnswer": {
                "@type": "Answer",

              }
            },
            {
              "@type": "Question",
              "name": "Funciona com o Claude Code?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim, e foi feito pensando nele: colar imagens e arrastar arquivos direto no terminal, seleção e cópia mesmo com o app usando o mouse e locale UTF-8 garantido. Codex, Gemini CLI, Antigravity ou qualquer outra CLI rodam do mesmo jeito, porque é um terminal de verdade."
