<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1200" viewBox="0 0 1600 1200">
  <!-- 4:3 social post (LinkedIn, Instagram): the logo alone. Rasterize with brand/build.sh -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#5b63d3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0f101a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#1f2433" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1200" fill="#0f101a"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>
  <rect width="1600" height="1200" fill="url(#glow)"/>
  <!-- logo: public/logo.svg (560x140) scaled 2x, centered -->
  <image href="logo.svg" x="240" y="460" width="1120" height="280"/>
  <text x="800" y="1080" text-anchor="middle" font-family="Inter, sans-serif" font-size="34" fill="#646e87">termhub.dev</text>
</svg>
